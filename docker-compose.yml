version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: instantguard
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/instantguard
    ports:
      - "3000:3000"
    depends_on:
      - db

  admin:
    build:
      context: .
      dockerfile: apps/admin-dashboard/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
